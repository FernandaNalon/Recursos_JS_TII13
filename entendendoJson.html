<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Aula de JSON - JavaScript</title>
</head>

<body>

<h1>Exemplo de uso de JSON</h1>

<p id="resultado"></p>

<script>

// =====================================================
// PARTE 1 - OBJETO JAVASCRIPT
// =====================================================

// Aqui estamos criando um OBJETO em JavaScript.
// Objetos são usados para organizar dados em pares
// chave : valor.

const aluno = {
    nome: "Carlos",
    idade: 20,
    curso: "Desenvolvimento de Sistemas"
};

// Podemos acessar os dados normalmente:

console.log("Objeto JavaScript:");
console.log(aluno);
console.log(aluno.nome);



// =====================================================
// PARTE 2 - CONVERTENDO OBJETO PARA JSON
// JSON.stringify()
// =====================================================

// JSON é um formato de TEXTO usado para trocar dados
// entre sistemas, APIs e servidores.

// A função JSON.stringify() transforma um objeto
// JavaScript em uma STRING no formato JSON.

const jsonAluno = JSON.stringify(aluno);

console.log("Objeto convertido para JSON:");
console.log(jsonAluno);

// Observe que agora o tipo virou STRING

console.log("Tipo da variável:");
console.log(typeof jsonAluno);



// =====================================================
// PARTE 3 - CONVERTENDO JSON PARA OBJETO
// JSON.parse()
// =====================================================

// Quando recebemos dados em JSON (por exemplo de uma API),
// precisamos transformar novamente em objeto JavaScript.

// JSON.parse() faz essa conversão.

const objetoNovamente = JSON.parse(jsonAluno);

console.log("JSON convertido novamente para objeto:");
console.log(objetoNovamente);



// =====================================================
// PARTE 4 - ACESSANDO DADOS DO OBJETO
// =====================================================

// Agora podemos acessar normalmente as propriedades.

console.log("Nome do aluno:");
console.log(objetoNovamente.nome);



// =====================================================
// PARTE 5 - EXIBINDO NA TELA
// =====================================================

// Também podemos mostrar os dados no HTML.

document.getElementById("resultado").innerText =
"Nome: " + objetoNovamente.nome +
" | Idade: " + objetoNovamente.idade +
" | Curso: " + objetoNovamente.curso;



// =====================================================
// PARTE 6 - EXEMPLO EXTRA COM LISTA
// =====================================================

// Criando outro objeto com vários valores

const frutas = {
    fruta1: "Maçã",
    fruta2: "Banana",
    fruta3: "Laranja"
};

// Convertendo para JSON

const jsonFrutas = JSON.stringify(frutas);

console.log("Lista de frutas em JSON:");
console.log(jsonFrutas);

// Convertendo de volta

const frutasObjeto = JSON.parse(jsonFrutas);

console.log("Fruta 1:");
console.log(frutasObjeto.fruta1);



</script>

</body>
</html>
